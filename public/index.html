<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalLedger</title><link rel="stylesheet" href="/style.css"><script src="/icons.js" defer></script><script type="module" src="/app.mjs"></script></head>
<body><header><div class="brand"><i data-lucide="scan-search"></i><strong>SignalLedger</strong><span>Company Evidence</span></div><div class="actions"><button id="refresh" title="Reload collected results" aria-label="Reload collected results"><i data-lucide="refresh-cw"></i></button><a href="/envelopes.jsonl" download title="Download result envelopes" aria-label="Download result envelopes"><i data-lucide="download"></i></a></div></header>
<main><section class="summary"><h1>Norwegian Company Register</h1><p id="status" role="status">Loading results...</p><div id="stats"></div></section>
<div class="workspace"><aside><label for="search">Company or organisation number</label><input id="search" type="search" placeholder="Search collected companies"><label for="state">Result state</label><select id="state"><option value="">All states</option><option>available</option><option>ambiguous</option><option>blocked</option><option>failed</option><option>not_available</option></select><div id="list" aria-label="Company results"></div></aside>
<section id="detail" aria-live="polite"><h2>Select a company</h2></section></div></main><footer>Public registry evidence <span>Collection cost: $0 API fees</span></footer></body></html>
